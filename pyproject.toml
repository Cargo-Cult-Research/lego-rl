[project]
name = "lego-rl"
version = "0.1.0"
description = "Sim-to-real RL for a LEGO 42124 self-balancing robot (Technic Hub + Pybricks)"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.1",
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lego_rl"]

[tool.pytest.ini_options]
# robot/ holds Pybricks scripts that only run on the hub, and two of them are
# named *_test.py (ring_test, _ab_test), which pytest happily collects and then
# dies importing pybricks. The package is the only thing worth collecting.
testpaths = ["tests"]
